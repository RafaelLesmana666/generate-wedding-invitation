<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generator Link Undangan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #3B6A8A;
      min-height: 100vh;
      padding: 24px 16px;
      background: linear-gradient(135deg, #FDEAEF, #EAF5FC)
    }

    .box {
      max-width: 640px;
      margin: 0 auto;
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(109, 184, 227, .2)
    }

    h1 {
      font-size: 1.4rem;
      color: #EE92AB;
      margin-bottom: 4px
    }

    p.sub {
      font-size: .9rem;
      opacity: .8;
      margin-bottom: 16px
    }

    label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      margin: 12px 0 4px
    }

    input,
    textarea {
      width: 100%;
      font: inherit;
      color: #3B6A8A;
      border: 1px solid #C3E3F6;
      border-radius: 10px;
      padding: 9px 12px;
      outline: none
    }

    input:focus,
    textarea:focus {
      border-color: #EE92AB;
      box-shadow: 0 0 0 3px rgba(238, 146, 171, .2)
    }

    textarea {
      min-height: 110px;
      resize: vertical
    }

    button,
    a.btn {
      font: inherit;
      font-size: .85rem;
      font-weight: 600;
      border: 0;
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      background: #C3E3F6;
      color: #3B6A8A;
      transition: transform .2s
    }

    button:hover,
    a.btn:hover {
      transform: translateY(-1px)
    }

    .main {
      background: #EE92AB;
      color: #fff;
      margin-top: 14px
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      border-top: 1px solid #EAF5FC;
      padding: 10px 0
    }

    .row .n {
      font-weight: 600;
      flex: 1 1 140px
    }

    .row .l {
      flex: 100%;
      font-size: .78rem;
      opacity: .7;
      word-break: break-all
    }

    .row .a {
      display: flex;
      gap: 6px
    }

    .wa {
      background: #8ED9A8 !important
    }

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px
    }

    .err {
      color: #D9788F;
      font-size: .85rem;
      margin-top: 8px
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Generator Link Undangan</h1>
    <p class="sub">Tempel daftar nama tamu, lalu buat link personal untuk masing-masing.</p>

    <label for="base">Alamat undangan</label>
    <input id="base" type="text" value="https://nama-proyek.vercel.app/" placeholder="https://nama-proyek.vercel.app/">

    <label for="names">Nama tamu (satu nama per baris)</label>
    <textarea id="names" placeholder="Budi Santoso&#10;Keluarga Bapak Hendra&#10;Sari &amp; Partner"></textarea>

    <label for="msg">Pesan WhatsApp (pakai {nama} dan {link})</label>
    <textarea
      id="msg">Assalamu'alaikum {nama}, kami mengundang Anda ke acara pernikahan kami. Detail undangan ada di sini: {link}</textarea>

    <button class="main" id="go" type="button">Buat Link</button>
    <p class="err" id="err" hidden></p>

    <div id="out" hidden>
      <div class="bar"><b id="count"></b><button id="copyAll" type="button">Salin semua (Nama, Link &amp; Pesan)</button></div>
      <div id="list"></div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const KEY = 'gen-link-v1';
    let rows = [];

    const qs = new URLSearchParams(location.search);
    const guest = (qs.get('base') || '').trim();

    try {
      const s = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (s.base) $('base').value = s.base;
      if (s.names) $('names').value = s.names;
      if (s.msg) $('msg').value = s.msg;

      if (guest) {
        $('base').value = guest;
      }
    } catch (e) { }

    const copy = async txt => {
      try { await navigator.clipboard.writeText(txt); }
      catch (e) {
        const t = document.createElement('textarea');
        t.value = txt;
        t.setAttribute('readonly', '');
        t.style.position = 'fixed';
        t.style.opacity = '0';
        document.body.appendChild(t);
        t.focus();
        t.select();
        t.setSelectionRange(0, t.value.length);
        let copied = false;
        try { copied = document.execCommand('copy'); }
        finally { t.remove(); }
        if (!copied) throw e;
      }
    };
    const messageFor = row => $('msg').value.replace(/\{nama\}/g, row.n).replace(/\{link\}/g, row.link);
    const copyError = () => alert('Gagal menyalin. Coba buka halaman melalui HTTPS atau salin teks secara manual.');
    const flash = (btn, label) => { const o = btn.textContent; btn.textContent = label; setTimeout(() => btn.textContent = o, 1500); };

    $('go').addEventListener('click', () => {
      const err = $('err'); err.hidden = true;

      let base;
      try { base = new URL($('base').value.trim()); }
      catch (e) { err.textContent = 'Alamat undangan belum valid. Contoh: https://nama-proyek.vercel.app/'; err.hidden = false; return; }

      const names = [...new Set($('names').value.split('\n').map(x => x.trim()).filter(Boolean))];
      if (!names.length) { err.textContent = 'Isi minimal satu nama tamu.'; err.hidden = false; return; }

      try { localStorage.setItem(KEY, JSON.stringify({ base: $('base').value, names: $('names').value, msg: $('msg').value })); } catch (e) { }

      rows = names.map(n => {
        const u = new URL(base.href);
        u.searchParams.set('to', n);
        return { n, link: u.toString() };
      });
      render();
    });

    function render() {
      const list = $('list'); list.innerHTML = '';
      rows.forEach(r => {
        const row = document.createElement('div'); row.className = 'row';
        const n = document.createElement('span'); n.className = 'n'; n.textContent = r.n;
        const a = document.createElement('div'); a.className = 'a';
        const c = document.createElement('button'); c.type = 'button'; c.textContent = 'Salin link';
        c.addEventListener('click', async () => {
          try { await copy(r.link); flash(c, 'Tersalin ✓'); }
          catch (e) { copyError(); }
        });
        const w = document.createElement('a'); w.className = 'btn wa'; w.textContent = 'WhatsApp'; w.target = '_blank'; w.rel = 'noopener';
        const text = messageFor(r);
        w.href = 'https://wa.me/?text=' + encodeURIComponent(text);
        a.append(c, w);
        const l = document.createElement('span'); l.className = 'l'; l.textContent = r.link;
        row.append(n, a, l); list.append(row);
      });
      $('count').textContent = rows.length + ' link siap dipakai';
      $('out').hidden = false;
    }

    $('copyAll').addEventListener('click', async e => {
      const text = rows.map(r => [
        'Nama: ' + r.n,
        'Link: ' + r.link,
        'Pesan: ' + messageFor(r)
      ].join('\n')).join('\n\n');
      try {
        await copy(text);
        flash(e.currentTarget, 'Tersalin ✓');
      } catch (error) {
        copyError();
      }
    });
  </script>
</body>

</html>
